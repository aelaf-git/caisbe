# CAISBE production Blueprint (main branch only).
# Staging / `dev` must use render.staging.yaml so it does not attach to `caisbe-db`.
#
# Deploy: Dashboard → New → Blueprint → connect this repo → Apply.
# Custom domains (add the DNS records Render shows after sync):
#   caisbe.org (+ www redirect) → caisbe-web
#   admin.caisbe.org            → caisbe-admin
#   portal.caisbe.org           → caisbe-portal
#   api.caisbe.org              → caisbe-api
#
# Server-side API_URL must use the Render private network (http://caisbe-api:10000),
# not api.caisbe.org or *.onrender.com. Those public hostnames go through Cloudflare
# and return Error 1000 (dns_loop) when called from another Render service.
# Next.js proxies rewrite accidental public API_URL values to http://<service>:10000.
#
# Cost note: every production web service is 0.5c-512mb ($7/mo, 0.5 CPU, 512 MB).
# The API also needs a persistent disk. Postgres stays on basic-256mb.

databases:
  - name: caisbe-db
    plan: basic-256mb
    databaseName: caisbe
    user: caisbe

services:
  # --- FastAPI + Alembic migrations on boot + uploads disk ---
  - type: web
    name: caisbe-api
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./api/Dockerfile.prod
    dockerContext: ./api
    healthCheckPath: /api/health
    domains:
      - api.caisbe.org
    disk:
      name: caisbe-uploads
      mountPath: /var/data/uploads
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Cloudflare R2 (or other S3-compatible). Set in the Render dashboard after creating the bucket.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: DATABASE_URL
        fromDatabase:
          name: caisbe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: CAISBE Admin
      - key: PORTAL_PUBLIC_URL
        value: https://portal.caisbe.org
      - key: CORS_ALLOWED_ORIGINS
        # Include www.* — Cloudflare may redirect admin/portal to www hosts.
        value: https://caisbe.org,https://www.caisbe.org,https://admin.caisbe.org,https://www.admin.caisbe.org,https://portal.caisbe.org,https://www.portal.caisbe.org
      # Resend — set RESEND_API_KEY in the dashboard (API key from resend.com).
      # Verify each From address domain in Resend before sending.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: CAISBE <noreply@caisbe.org>
      - key: EMAIL_FROM_NEWSLETTER
        value: CAISBE Newsletter <newsletter@caisbe.org>
      - key: EMAIL_FROM_CONTACT
        value: CAISBE <contact@caisbe.org>
      - key: EMAIL_FROM_INFO
        value: CAISBE <info@caisbe.org>
      - key: EMAIL_FROM_SYSTEM
        value: CAISBE <noreply@caisbe.org>

  # --- Marketing site ---
  - type: web
    name: caisbe-web
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./web/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    domains:
      - caisbe.org
    envVars:
      - key: API_URL
        value: http://caisbe-api:10000
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe.org
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://admin.caisbe.org
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://portal.caisbe.org

  # --- Admin LMS ---
  - type: web
    name: caisbe-admin
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./admin/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    domains:
      - admin.caisbe.org
    envVars:
      - key: API_URL
        value: http://caisbe-api:10000
      - key: NEXT_PUBLIC_API_URL
        value: https://api.caisbe.org
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe.org
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://admin.caisbe.org
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://portal.caisbe.org

  # --- Student portal ---
  - type: web
    name: caisbe-portal
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./portal/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    domains:
      - portal.caisbe.org
    envVars:
      - key: API_URL
        value: http://caisbe-api:10000
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe.org
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://admin.caisbe.org
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://portal.caisbe.org
