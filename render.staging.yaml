# Staging Blueprint for CAISBE-DEV (dev branch).
# Names and public URLs match the live Render services (suffix -090a).
# Every resource here is Free: services spin down when idle, and there is no disk.
#
# Server-side API_URL must be the private network host (http://caisbe-staging-api-090a:10000).
# Public *.onrender.com API URLs cause Cloudflare Error 1000 from Render → Render.
#
# After you push this file to `dev`:
#   Blueprint CAISBE-DEV → Manual sync
# Then Manual Deploy web, admin, and portal so Next.js picks up the new URLs.

databases:
  - name: caisbe-staging-db-090a
    plan: free
    databaseName: caisbe_staging
    user: caisbe_staging

services:
  - type: web
    name: caisbe-staging-api-090a
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile.prod
    dockerContext: ./api
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: DATABASE_URL
        fromDatabase:
          name: caisbe-staging-db-090a
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: CAISBE Staging Admin
      - key: PORTAL_PUBLIC_URL
        value: https://caisbe-staging-portal-090a.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://caisbe-staging-web-090a.onrender.com,https://caisbe-staging-admin-090a.onrender.com,https://caisbe-staging-portal-090a.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: CAISBE <noreply@caisbe.org>
      - key: EMAIL_FROM_NEWSLETTER
        value: CAISBE Newsletter <newsletter@caisbe.org>
      - key: EMAIL_FROM_CONTACT
        value: CAISBE <contact@caisbe.org>
      - key: EMAIL_FROM_INFO
        value: CAISBE <info@caisbe.org>
      - key: EMAIL_FROM_SYSTEM
        value: CAISBE <noreply@caisbe.org>

  - type: web
    name: caisbe-staging-web-090a
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./web/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: http://caisbe-staging-api-090a:10000
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe-staging-web-090a.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://caisbe-staging-admin-090a.onrender.com
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://caisbe-staging-portal-090a.onrender.com

  - type: web
    name: caisbe-staging-admin-090a
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./admin/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: http://caisbe-staging-api-090a:10000
      - key: NEXT_PUBLIC_API_URL
        value: https://caisbe-staging-api-090a.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe-staging-web-090a.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://caisbe-staging-admin-090a.onrender.com
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://caisbe-staging-portal-090a.onrender.com

  - type: web
    name: caisbe-staging-portal-090a
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./portal/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: http://caisbe-staging-api-090a:10000
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe-staging-web-090a.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://caisbe-staging-admin-090a.onrender.com
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://caisbe-staging-portal-090a.onrender.com
