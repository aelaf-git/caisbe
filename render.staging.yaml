# Staging Blueprint for CAISBE-DEV (dev branch).
# Names and public URLs match the live Render services (suffix -090a).
#
# After you push this file to `dev`:
#   Blueprint CAISBE-DEV → Manual sync
# Then Manual Deploy web, admin, and portal so Next.js picks up the new URLs.

databases:
  - name: caisbe-staging-db-090a
    plan: basic-256mb
    databaseName: caisbe_staging
    user: caisbe_staging

services:
  - type: web
    name: caisbe-staging-api-090a
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./api/Dockerfile.prod
    dockerContext: ./api
    healthCheckPath: /api/health
    disk:
      name: caisbe-staging-uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: caisbe-staging-db-090a
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: CAISBE Staging Admin
      - key: PORTAL_PUBLIC_URL
        value: https://caisbe-staging-portal-090a.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://caisbe-staging-web-090a.onrender.com,https://caisbe-staging-admin-090a.onrender.com,https://caisbe-staging-portal-090a.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: newsletter@caisbe.org
      - key: SMTP_USE_TLS
        value: "true"

  - type: web
    name: caisbe-staging-web-090a
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./web/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: https://caisbe-staging-api-090a.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe-staging-web-090a.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://caisbe-staging-admin-090a.onrender.com
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://caisbe-staging-portal-090a.onrender.com

  - type: web
    name: caisbe-staging-admin-090a
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./admin/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: https://caisbe-staging-api-090a.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://caisbe-staging-api-090a.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe-staging-web-090a.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://caisbe-staging-admin-090a.onrender.com
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://caisbe-staging-portal-090a.onrender.com

  - type: web
    name: caisbe-staging-portal-090a
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./portal/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: https://caisbe-staging-api-090a.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe-staging-web-090a.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://caisbe-staging-admin-090a.onrender.com
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://caisbe-staging-portal-090a.onrender.com
