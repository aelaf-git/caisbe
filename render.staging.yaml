# Staging Blueprint — always apply this file for the `dev` branch.
# Do not reuse render.yaml for staging: Render will attach DATABASE_URL to
# the existing production database named `caisbe-db`.
#
# Dashboard → New → Blueprint → repo aelaf-git/caisbe
#   Branch: dev
#   Blueprint path: render.staging.yaml
#   Create all as new services
#
# After first deploy, replace the onrender.com URLs below if Render suffixes them,
# then redeploy web / admin / portal.

databases:
  - name: caisbe-staging-db
    plan: basic-256mb
    databaseName: caisbe_staging
    user: caisbe_staging

services:
  - type: web
    name: caisbe-staging-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./api/Dockerfile.prod
    dockerContext: ./api
    healthCheckPath: /api/health
    disk:
      name: caisbe-staging-uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: caisbe-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: CAISBE Staging Admin
      - key: PORTAL_PUBLIC_URL
        value: https://caisbe-staging-portal.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://caisbe-staging-web.onrender.com,https://caisbe-staging-admin.onrender.com,https://caisbe-staging-portal.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: newsletter@caisbe.org
      - key: SMTP_USE_TLS
        value: "true"

  - type: web
    name: caisbe-staging-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./web/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: https://caisbe-staging-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe-staging-web.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://caisbe-staging-admin.onrender.com
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://caisbe-staging-portal.onrender.com

  - type: web
    name: caisbe-staging-admin
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./admin/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: https://caisbe-staging-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://caisbe-staging-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe-staging-web.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://caisbe-staging-admin.onrender.com
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://caisbe-staging-portal.onrender.com

  - type: web
    name: caisbe-staging-portal
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./portal/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: https://caisbe-staging-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://caisbe-staging-web.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://caisbe-staging-admin.onrender.com
      - key: NEXT_PUBLIC_PORTAL_URL
        value: https://caisbe-staging-portal.onrender.com
