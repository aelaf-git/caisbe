services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: caisbe-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: http://caisbe-api:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
      NEXT_PUBLIC_PORTAL_URL: http://localhost:3002
    networks:
      - default
      - caisbe_dev
    develop:
      watch:
        - action: sync
          path: .
          target: /app/web
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./package.json

networks:
  caisbe_dev:
    external: true
    name: caisbe_dev
