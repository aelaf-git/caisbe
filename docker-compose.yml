services:
  postgres:
    image: postgres:18
    container_name: caisbe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: caisbe
      POSTGRES_USER: caisbe
      POSTGRES_PASSWORD: caisbe
    ports:
      # Host Postgres already uses 5432; this stack listens on 5433.
      - "5433:5432"
    volumes:
      - caisbe_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caisbe -d caisbe"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  caisbe_pgdata:
